# Posts to Microsoft Teams ONLY when a human is needed. Requires repo secret TEAMS_WEBHOOK_URL.
# Teams side: a Workflows flow "When a webhook request is received" (trigger: Anyone)
# → "Send a message in a chat or channel" with Message body = triggerBody()?['text'].
# If the secret is missing, the job does nothing.
name: Notify humans

on:
  pull_request:
    types: [review_requested, labeled, ready_for_review]
  issues:
    types: [opened, labeled]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    if: >-
      github.event.action == 'review_requested' ||
      github.event.action == 'ready_for_review' ||
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'request')) ||
      github.event.label.name == 'needs-approval' ||
      github.event.label.name == 'blocked' ||
      github.event.label.name == 'contract'
    steps:
      - name: Send to Teams
        env:
          WEBHOOK: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
          URL: ${{ github.event.pull_request.html_url || github.event.issue.html_url }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          REVIEWER: ${{ github.event.requested_reviewer.login }}
          ASSIGNEES: ${{ join(github.event.issue.assignees.*.login, ', ') }}
        run: |
          [ -z "$WEBHOOK" ] && { echo "No webhook configured, skipping."; exit 0; }
          case "$ACTION" in
            review_requested)  MSG="👀 <b>Review requested</b> from $REVIEWER" ;;
            ready_for_review)  MSG="📬 <b>PR ready for review</b>" ;;
            opened)            MSG="📨 <b>New request</b> for ${ASSIGNEES:-unassigned}" ;;
            labeled)           MSG="🏷️ <b>$LABEL</b>" ;;
          esac
          jq -n --arg msg "$MSG" --arg title "$TITLE" --arg url "$URL" '
            def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
            { text: "\($msg): <a href=\"\($url)\">\($title | esc)</a>" }' \
            | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK"
