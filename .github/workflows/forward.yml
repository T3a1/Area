name: Forward to Epitech

# Work happens on this public repo (free Actions). Every pushed branch or tag is copied
# to the Epitech repo with an SSH key whose public half is on a team member's GitHub account.
# Once the CI exists (task M02), move this job into it with `needs:` on the CI jobs,
# so only green code is forwarded.
on:
  push:
    branches: ['**']
    tags: ['*']

# The job pushes with its own SSH key: the workflow token only reads.
permissions:
  contents: read

env:
  EPITECH_REPO: git@github.com:EpitechPGE3-2026/G-YEP-500-LIL-5-1-area-15.git

jobs:
  forward:
    name: Push to the Epitech repo
    timeout-minutes: 10
    # This file is forwarded too: never run it on the Epitech repo.
    if: github.repository == 'T3a1/Area'
    runs-on: ubuntu-24.04
    concurrency:
      group: forward-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load the SSH key
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.EPITECH_DEPLOY_KEY }}
      - name: Push the ref
        # GitHub sometimes refuses a push for a moment: try again before failing.
        run: |
          for attempt in 1 2 3 4; do
            git push --force "$EPITECH_REPO" "$GITHUB_SHA:$GITHUB_REF" && exit 0
            echo "Push $attempt failed"
            sleep 60
          done
          exit 1
